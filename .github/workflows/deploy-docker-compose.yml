name: Deploy with Docker Compose

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docker-compose
  cancel-in-progress: false

jobs:
  deploy:
    # Do not deploy the template repository, only projects created from it
    if: github.repository != 'fastapi/full-stack-fastapi-template'
    runs-on: self-hosted
    timeout-minutes: 30
    environment: production
    # Required reviewers/environment protection need native owner readback before use.
    env:
      DOMAIN: ${{ vars.DOMAIN }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      FRONTEND_HOST: ${{ vars.FRONTEND_HOST }}
      WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      WORKOS_ISSUER: ${{ vars.WORKOS_ISSUER }}
      WORKOS_JWKS_URL: ${{ vars.WORKOS_JWKS_URL }}
      WORKOS_API_HOSTNAME: ${{ vars.WORKOS_API_HOSTNAME }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_USER: ${{ vars.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ vars.EMAILS_FROM_EMAIL }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker compose -f compose.yml -f compose.deploy.yml build
      - name: Prepare database
        env:
          API_MIGRATION_DATABASE_URL: ${{ secrets.API_MIGRATION_DATABASE_URL }}
        run: docker compose -f compose.yml -f compose.deploy.yml run --rm migrate
      - name: Start application
        run: docker compose -f compose.yml -f compose.deploy.yml up -d
